[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-of-dynamical-systems-using-recurrent-neural-networks"
version = "0.1.0"
description = "examples how to learn dynamical system behavior by recurrent neural network"
readme = "README.md"
requires-python = ">=3.10, <3.12"
dependencies = [
    "ipykernel>=6.29.5",
    "keras>=3.8.0",
    "matplotlib>=3.10.0",
    "neuromancer>=1.5.3",
    "numpy==1.26.0",
    "pandas>=2.2.3",
    "tensorflow>=2.4.0",
]

[tool.setuptools.packages]
find = {}
